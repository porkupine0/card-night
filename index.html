<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Night</title>
<meta name="description" content="All 13 card game score keepers in one place, with every game's history and one backup.">
<meta name="theme-color" content="#5b5ee6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Card Night">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32-v2.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet" crossorigin>
<style>
:root{--bg:#f4f2fb;--surface:#fff;--ink:#1d1b33;--muted:#5d5b78;--line:#e2def2;--top:linear-gradient(135deg,#1fb8d6,#5b5ee6 52%,#9a1fa8);--brand:#4f46e5;--on-top:#fff;--gold:#b7841b;--good:#1d7a4c;--good-bg:#e3f2e8;--bad:#b3261e;--shadow:0 1px 2px rgba(30,20,0,.06),0 6px 18px rgba(30,20,0,.07);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d1a;--surface:#181629;--ink:#eeedf7;--muted:#a3a1bf;--line:#2b2944;--top:linear-gradient(135deg,#0e7f96,#3f3fbf 52%,#6d1580);--brand:#6c66f0;--on-top:#fff;--gold:#e9bd55;--good:#63c993;--good-bg:#13301f;--bad:#ff8a80;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0d1a;--surface:#181629;--ink:#eeedf7;--muted:#a3a1bf;--line:#2b2944;--top:linear-gradient(135deg,#0e7f96,#3f3fbf 52%,#6d1580);--brand:#6c66f0;--on-top:#fff;--gold:#e9bd55;--good:#63c993;--good-bg:#13301f;--bad:#ff8a80;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree",system-ui,-apple-system,sans-serif;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 14px;font-weight:700;min-height:44px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{background:var(--top);color:var(--on-top);padding:calc(22px + env(safe-area-inset-top,0px)) 16px 26px}
.top .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:14px}
.top img{width:52px;height:52px;border-radius:13px;box-shadow:0 2px 10px rgba(0,0,0,.3);flex:none}
.top h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.01em}
.top p{margin:2px 0 0;opacity:.85;font-size:15px}
main{max-width:600px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:18px}
main>:first-child{margin-top:-12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.panel h2{margin:0;font-size:19px;font-weight:800}
.hint{margin:0;font-size:14px;color:var(--muted)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1 1 auto}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;box-shadow:var(--shadow);min-width:0;position:relative}
.tile:active{transform:scale(.98)}
.tile img{width:48px;height:48px;border-radius:12px;display:block}
.tile b{font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.tile span{font-size:13px;color:var(--muted);line-height:1.3}
.tile .live{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--good);background:var(--good-bg);border-radius:999px;padding:2px 8px}
.cont{border:2px solid var(--gold)}
.cont .row{display:flex;align-items:center;gap:12px}
.cont img{width:44px;height:44px;border-radius:11px;flex:none}
.cont a.go{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;text-decoration:none}
.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat div{flex:1 1 120px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.ok{color:var(--good);font-weight:700;font-size:14px;margin:0}
textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
ol{margin:0;padding-left:20px;font-size:15px}
ol li{margin:2px 0}
@media (max-width:340px){.games{grid-template-columns:1fr}}
/* ai:css:start */
/* Claude helper (shared): the full-screen sheet, the Ask card, and the camera buttons. Uses the app's colors. */
.cai-modal{position:fixed;inset:0;z-index:70;background:var(--bg,#fff);color:var(--ink,#111);display:flex;flex-direction:column}
.cai-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.cai-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.cai-top{display:flex;align-items:center;gap:10px}
.cai-top h2{margin:0;flex:1;min-width:0;font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.cai-box{background:var(--surface,#fff);border:1px solid var(--line,#ddd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.cai textarea{font:inherit;font-size:16px;line-height:1.4;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line,#ccc);background:var(--bg,#fff);color:var(--ink,#111);resize:vertical;min-height:0}
.cai textarea:focus-visible,.cai input:focus-visible,.cai button:focus-visible,.cai a:focus-visible{outline:3px solid var(--accent,var(--amber,var(--gold,var(--green,#555))));outline-offset:2px}
.cai .cai-key{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;resize:none}
.cai-lbl{font-weight:700;font-size:15px}
.cai-hint{font-size:14px;color:var(--muted,#666);margin:0;line-height:1.45}
.cai-row{display:flex;gap:8px;flex-wrap:wrap}
.cai-row>button{flex:1 1 auto}
.cai-grow{flex:1;min-width:0}
.cai-chips{display:flex;flex-wrap:wrap;gap:6px}
.cai .cai-chip{padding:7px 12px;border-radius:999px;font-size:14px;font-weight:600;text-align:left;line-height:1.3}
.cai-ans{margin:0;font-size:17px;line-height:1.5;font-weight:600;white-space:pre-line}
.cai-rule{margin:0;padding:8px 12px;border-left:4px solid var(--accent,var(--amber,var(--gold,var(--green,#888))));background:var(--surface-2,rgba(128,128,128,.12));border-radius:0 10px 10px 0;font-size:14.5px;line-height:1.45}
.cai-ok{margin:0;padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;color:var(--good,var(--green,#1f7a4d));background:var(--good-bg,var(--mint-bg,rgba(31,122,77,.12)))}
.cai-err{margin:0;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--err,var(--bad,var(--red,#b3261e)));background:var(--err-bg,var(--bad-bg,var(--warn-bg,rgba(179,38,30,.1))))}
.cai-link{border:0;background:none;padding:0;min-height:0;font:inherit;font-size:14px;font-weight:700;color:var(--ink,inherit);text-decoration:underline;text-underline-offset:2px;cursor:pointer;align-self:flex-start}
.cai-img{display:block;max-width:100%;max-height:220px;object-fit:contain;border-radius:10px;align-self:center;background:var(--surface-2,rgba(128,128,128,.12))}
.cai-pulse{animation:cai-pulse 1.2s ease-in-out infinite}
@keyframes cai-pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.cai-pulse{animation:none}}
.cai-card{gap:8px}
.cai-card .cai-row>button{flex:0 0 auto}
.cai-cams{grid-column:1 / -1}
.cai-cams>button{flex:0 1 auto}
.cai-pick{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line,#ddd);font-size:15px;line-height:1.45;cursor:pointer}
.cai-pick:first-of-type{border-top:0;padding-top:0}
.cai-pick input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--accent,var(--amber,var(--gold,var(--green,#555))))}
.cai-grid{display:grid;gap:6px;justify-content:start}
.cai-grid span{min-width:44px;height:52px;padding:0 4px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line,#ccc);background:var(--bg,#fff);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.cai-grid span.x{opacity:.45;text-decoration:line-through}
.cai-grid span.q{border-style:dashed;color:var(--muted,#666)}
.cai-sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px;margin:0}
.cai-sum dt{color:var(--muted,#666)}
.cai-sum dd{margin:0;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.cai-big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
/* ai:css:end */
</style>
</head>
<body>
<header class="top"><div class="in"><img src="apple-touch-icon-v2.png" alt=""><div><h1>Card Night</h1><p>13 score keepers, one icon</p></div></div></header>
<main id="app"></main>
<script>
// Card Night: one Home Screen icon for every card game score keeper. The games are separate apps on this same site,
// so inside this app they all share one storage: one History move from Safari and one backup cover every game.
const GAMES = [
  { dir:"Golf-Score", id:"card-golf", save:"card-golf-scorecard-v1", name:"Card Golf", unit:["hole","holes"] },
  { dir:"Casino-Card-Game", id:"casino", save:"casino-scorekeeper-v1", name:"Casino", unit:["round","rounds"] },
  { dir:"Cribbage", id:"cribbage", save:"cribbage-board-v1", name:"Cribbage", unit:["hand","hands"] },
  { dir:"Euchre-Score", id:"euchre", save:"euchre-scorekeeper-v1", name:"Euchre", unit:["hand","hands"] },
  { dir:"Flip7", id:"flip7", save:"flip7-scorecard-v1", name:"Flip 7", unit:["round","rounds"] },
  { dir:"Hand-Foot-Scoring", id:"hand-foot", save:"hand-foot-scorekeeper-v1", name:"Hand & Foot", unit:["round","rounds"] },
  { dir:"Hearts-Score", id:"hearts", save:"hearts-scorekeeper-v1", name:"Hearts", unit:["hand","hands"] },
  { dir:"Mao", id:"mao", save:"mao-game-v1", name:"Mao", unit:["hand","hands"], lead:n => `${n} hand${n === 1 ? "" : "s"} won` },
  { dir:"Pitch", id:"pitch", save:"pitch-scorekeeper-v1", name:"Pitch", unit:["hand","hands"] },
  { dir:"P-A", id:"presidents", save:"presidents-game-v1", name:"Presidents", unit:["round","rounds"], lead:n => `${n}× President` },
  { dir:"Skyjo-score", id:"skyjo", save:"skyjo-scorekeeper-v1", name:"Skyjo", unit:["round","rounds"] },
  { dir:"Spades-Score", id:"spades", save:"spades-scorekeeper-v1", name:"Spades", unit:["hand","hands"] },
  { dir:"Up-Down-the-River", id:"up-down-river", save:"river-scorekeeper-v1", name:"Up & Down the River", unit:["round","rounds"] }
];
const BUNDLE = "card-games-history", DAY = 864e5;
const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const standalone = () => navigator.standalone === true || !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const plural = (n, w, ws) => `${n.toLocaleString("en-US")} ${n === 1 ? w : (ws || w + "s")}`;
const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const ui = { msg:"", moveMsg:"", pasteBox:false, ready:0, offline:"", install:null };

// ----- reading each game's History (the same keys the games write) -----
const key = G => G.id + "-history-v1";
function load(G){ try{ const a = JSON.parse(localStorage.getItem(key(G)) || "[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
const done = (G, g) => G.id === "card-golf" ? Array.isArray(g.holes) && g.holes.length === 9 : !!g.done;
const when = g => Date.parse(g.updated || g.date) || 0;
// A game counts as being played only if the game's own save points at it. An unfinished game copied in from
// Safari or another icon is just History here: the game itself was left open over there.
function playing(G, g){
  let s = null; try{ s = JSON.parse(localStorage.getItem(G.save) || "null"); }catch(e){ s = null; }
  if (!s || !g) return false;
  return G.id === "card-golf" ? s.phase === "play" && s.id === g.id : s.hxId === g.id;
}
function info(G){
  const list = load(G), latest = list.slice().sort((a, b) => when(b) - when(a))[0];
  const live = list.find(g => !done(G, g) && playing(G, g)) || null;
  return { n:list.length, fin:list.filter(g => done(G, g)).length, last:latest ? when(latest) : 0, live };
}
function rel(t){
  const d = Math.round((dayStart(Date.now()) - dayStart(t)) / DAY);
  if (d <= 0) return "today"; if (d === 1) return "yesterday"; if (d < 7) return `${d} days ago`;
  const x = new Date(t); return x.toLocaleDateString(undefined, x.getFullYear() === new Date().getFullYear() ? { month:"short", day:"numeric" } : { month:"short", day:"numeric", year:"numeric" });
}
function liveLine(G, g){
  if (G.id === "card-golf"){
    const t = g.players.map((_, i) => g.holes.reduce((s, h) => s + (+h[i] || 0), 0)), lo = Math.min(...t), who = g.players.filter((_, i) => t[i] === lo);
    return `${g.holes.length} of 9 holes · ${who.length > 1 ? `${who.join(" & ")} tied` : `${who[0]} leads`} with ${lo}`;
  }
  const t = Array.isArray(g.totals) && g.totals.length === g.sides.length ? g.totals : g.sides.map((_, i) => g.rounds.reduce((s, r) => s + (+r[i] || 0), 0));
  const best = g.lowWins ? Math.min(...t) : Math.max(...t);
  const name = s => s.players.length > 1 ? (/^(team|side) \d+$/i.test(s.name) || !s.name ? s.players.join(" & ") : s.name) : (s.players[0] || s.name);
  const lead = g.sides.filter((_, i) => t[i] === best).map(name);
  const how = G.lead ? G.lead(best) : `with ${best.toLocaleString("en-US")}`;
  return `${plural(g.rounds.length, G.unit[0], G.unit[1])} · ${lead.length > 1 ? `${lead.join(" & ")} tied` : `${lead[0]} leads`}${G.lead ? `, ${how}` : ` ${how}`}`;
}

// ----- the bundle: every game's History in one piece (the format the games' Copy for Home Screen uses) -----
function bundle(){
  const apps = {}; let n = 0, k = 0;
  GAMES.forEach(G => { const a = load(G); if (a.length){ apps[G.id] = a; n += a.length; k++; } });
  return { text:JSON.stringify({ kind:BUNDLE, version:1, exported:new Date().toISOString(), apps }), games:n, apps:k };
}
const validHx = g => !!g && typeof g.id === "string" && Array.isArray(g.sides) && g.sides.length >= 1 && g.sides.every(s => s && typeof s.name === "string" && Array.isArray(s.players))
  && Array.isArray(g.rounds) && g.rounds.every(r => Array.isArray(r) && r.length === g.sides.length && r.every(v => typeof v === "number" && isFinite(v)));
const validGolf = g => !!g && typeof g.id === "string" && Array.isArray(g.players) && g.players.length >= 2 && g.players.every(p => typeof p === "string")
  && Array.isArray(g.holes) && g.holes.length >= 1 && g.holes.length <= 9 && g.holes.every(h => Array.isArray(h) && h.length === g.players.length && h.every(Number.isInteger));
// Adds the games each History doesn't have yet. Games already here are left alone, so a game being played is never touched.
function mergeAll(apps){
  let added = 0, here = 0, bad = 0; const touched = [];
  GAMES.forEach(G => {
    const list = apps && Array.isArray(apps[G.id]) ? apps[G.id] : null; if (!list || !list.length) return;
    const cur = load(G), ids = new Set(cur.map(g => g.id)), ok = G.id === "card-golf" ? validGolf : validHx; let a = 0;
    list.forEach(g => { if (!ok(g)){ bad++; return; } if (ids.has(g.id)){ here++; return; } const c = JSON.parse(JSON.stringify(g)); if (isNaN(Date.parse(c.date))) c.date = new Date().toISOString(); cur.push(c); ids.add(c.id); a++; });
    if (a){ try{ localStorage.setItem(key(G), JSON.stringify(cur)); }catch(e){ bad += a; a = 0; } }
    if (a){ added += a; touched.push(G.name); }
  });
  return `Added ${plural(added, "game")}${touched.length ? ` to ${touched.length > 3 ? plural(touched.length, "game's History", "games' History") : touched.join(", ")}` : ""}.` + (here ? ` ${here} already here.` : "") + (bad ? ` ${bad} unreadable.` : "");
}
function readBundle(text){
  let d = null; try{ d = JSON.parse(text); }catch(e){ return null; }
  if (d && d.kind === BUNDLE && d.apps && typeof d.apps === "object") return d.apps;
  // a single game's backup file
  const G = d && GAMES.find(x => x.id === d.app);
  if (G && Array.isArray(d.games)) return { [G.id]:d.games };
  return null;
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){ /* older browsers: copy from a hidden box */ }
  const t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
  let ok = false; try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
  t.remove(); return ok;
}
function file(){ const b = bundle(); return { b, f:new File([b.text], `card-night-history-${new Date().toISOString().slice(0, 10)}.json`, { type:"application/json" }) }; }
// each game counts finished games since its last backup; a backup here counts for all of them
function markAll(){ GAMES.forEach(G => { try{ localStorage.setItem(G.id + "-last-backup", String(load(G).filter(g => done(G, g)).length)); }catch(e){} }); }

// ----- views -----
function render(){
  const all = GAMES.map(G => ({ G, i:info(G) })), total = all.reduce((s, x) => s + x.i.n, 0), played = all.filter(x => x.i.n).length;
  const live = all.filter(x => x.i.live).sort((a, b) => when(b.i.live) - when(a.i.live))[0];
  const cont = live ? `<section class="panel cont" aria-label="Pick up where you left off"><span class="eyebrow">Pick up where you left off</span>
    <div class="row"><img src="icons/${live.G.id}.png" alt=""><div><b>${esc(live.G.name)}</b><div class="hint">${esc(liveLine(live.G, live.i.live))}</div></div></div>
    <a class="go" href="/${live.G.dir}/" data-go="${live.G.dir}" id="continue">Continue ${esc(live.G.name)}</a></section>` : "";
  const tiles = all.map(({ G, i }) => `<a class="tile" href="/${G.dir}/" data-go="${G.dir}" id="go-${G.id}" aria-label="${esc(G.name)}. ${i.n ? `${plural(i.fin, "finished game")}, last played ${rel(i.last)}` : "No games yet"}${i.live ? ". Game in progress" : ""}">
      <img src="icons/${G.id}.png" alt="" width="48" height="48">${i.live ? `<em class="live">Playing</em>` : ""}<b>${esc(G.name)}</b>
      <span>${i.n ? `${i.fin ? plural(i.fin, "game") : plural(i.n, "unfinished game")} · ${rel(i.last)}` : "No games yet"}</span></a>`).join("");
  const backup = `<section class="panel" aria-labelledby="h-backup"><h2 id="h-backup">History &amp; backup</h2>
    <div class="stat"><div><b>${total.toLocaleString("en-US")}</b><span>games saved</span></div><div><b>${played}</b><span>of 13 card games played</span></div></div>
    <p class="hint">Every game's History lives on this phone. One backup here covers all 13 games, and Restore adds back any games this phone doesn't have.</p>
    <div class="btnrow"><button type="button" data-a="share" id="share" ${total ? "" : "disabled"}>Share backup</button><button type="button" data-a="download" id="download" ${total ? "" : "disabled"}>Download</button><button type="button" data-a="restore" id="restore">Restore</button></div>
    ${ui.msg ? `<p class="hint" role="status">${esc(ui.msg)}</p>` : ""}</section>`;
  let move = "";
  if (iOS && !standalone()) move = `<section class="panel" aria-labelledby="h-home"><h2 id="h-home">Put Card Night on your Home Screen</h2>
    <p class="hint">One icon opens every game, offline too, and iPhone doesn't clear a Home Screen app's data the way Safari can. The Home Screen app keeps its own storage, so bring your History along:</p>
    <ol><li>Tap <b>Copy for Home Screen</b> below.</li><li>Tap Share <span aria-hidden="true">⎙</span>, then <b>Add to Home Screen</b>.</li><li>Open Card Night from your Home Screen and tap <b>Paste History</b>.</li></ol>
    <div class="btnrow"><button type="button" class="primary" data-a="copy" id="copy">Copy for Home Screen</button></div>

    const q = ui.q.trim(); if (ui.busy) return;
    if (!q) { ui.err = "Type your question first."; draw(); return; }
    const sit = situation(), prev = ui.res && ui.asked ? `Earlier they asked “${ui.asked}” and you answered: “${ui.res.answer}”.\n\n` : "";
    ui.busy = true; ui.err = ""; draw();
    try {
      const r = await call({ system: system(), content: [{ type: "text", text: `${sit ? sit + "\n\n" : ""}${prev}Their question: “${q}”\n\n"answer": the ruling and a sentence or two on why. "rule": the line from the app's rules that settles it, quoted or closely paraphrased, or "" if none does. "covered": true if the app's rules settle it.` }],
        schema: { type: "object", additionalProperties: false, required: ["answer", "rule", "covered"], properties: { answer: { type: "string" }, rule: { type: "string" }, covered: { type: "boolean" } } } });
      ui.res = { answer: String(r.answer || "").trim() || "No answer came back. Try asking another way.", rule: String(r.rule || "").trim(), covered: r.covered !== false };
      ui.asked = q; ui.q = "";
    } catch (err) { ui.err = fail(err); }
    ui.busy = false; draw();
  }

  // ----- count cards from a photo (apps with AI.count) -----
  function countBtns(i) {
    if (!key || !AI.count) return "";
    return `<div class="cai-row cai-cams">${Object.entries(AI.count).map(([k, c]) => `<button type="button" class="small cai-cam" data-ai="count" data-k="${e(k)}" data-i="${i}" id="cai-cam-${e(k)}-${i}">${e(c.label || "📷 Count from a photo")}</button>`).join("")}</div>`;
  }
  function pick(kind, i) {
    let f = document.getElementById("cai-file");
    if (!f) {
      f = document.createElement("input"); f.type = "file"; f.accept = "image/*"; f.id = "cai-file"; f.hidden = true; document.body.appendChild(f);
      f.addEventListener("change", () => { const file = f.files && f.files[0], w = f.dataset; f.value = ""; if (file) countRead(file, w.kind, +w.i); });
    }
    f.dataset.kind = kind; f.dataset.i = i; f.click();
  }
  async function countRead(file, kind, i) {
    const spec = AI.count && AI.count[kind]; if (!spec) return;
    if (ui.job && ui.job.url) URL.revokeObjectURL(ui.job.url);
    const job = ui.job = { kind, i, title: spec.title(i), url: "", out: null, err: "" };
    ui.busy = true; open("count");
    let blob;
    try { blob = await shrink(file); } catch (err) { if (ui.job === job) { job.err = "That file couldn't be opened as a photo."; ui.busy = false; draw(); } return; }
    if (ui.job !== job) return;
    job.url = URL.createObjectURL(blob); draw();
    try {
      const r = await call({ system: system(), content: [{ type: "image", source: { type: "base64", media_type: "image/jpeg", data: await b64(blob) } }, { type: "text", text: spec.task(i) }], schema: spec.schema });
      if (ui.job !== job) return;
      if (r.found === false) job.err = String(r.note || "").trim() || "No cards found in that photo. Try a closer, sharper shot from above.";
      else job.out = spec.compute(r, i);
    } catch (err) { if (ui.job === job) job.err = fail(err); }
    if (ui.job === job) { ui.busy = false; draw(); }
  }
  function countView() {
    const job = ui.job, spec = job && AI.count[job.kind]; if (!spec) return "";
    const img = job.url ? `<img class="cai-img" src="${job.url}" alt="Your photo">` : "";
    if (ui.busy) return `${img}${busyLine("Reading the cards")}<p class="cai-hint">Usually 20–40 seconds.</p>`;
    if (!job.out) return `${img}${job.err ? `<p class="cai-err">${e(job.err)}</p>` : ""}<button type="button" class="primary" data-ai="count" data-k="${e(job.kind)}" data-i="${job.i}" id="cai-retake">📷 Try another photo</button>${keyFoot()}`;
    return `${img}<div class="cai-box" id="cai-count">${spec.view(job.out, job.i)}</div>
      ${job.out.warn ? `<p class="cai-err">${e(job.out.warn)}</p>` : ""}
      <p class="cai-hint">Check it against the cards. You can change any number after it's filled in.</p>
      <button type="button" class="primary" data-ai="countUse" id="cai-countUse">${e(spec.useLabel ? spec.useLabel(job.out, job.i) : "Use these numbers")}</button>
      <button type="button" data-ai="count" data-k="${e(job.kind)}" data-i="${job.i}" id="cai-retake">📷 Use a different photo</button>
      <p class="cai-hint">The photo isn't kept: it's gone as soon as you close this.</p>`;
  }

  // ----- new rules for the rule deck (apps with AI.fresh) -----
  function freshCard() {
    if (!AI.fresh) return "";
    return `<div class="panel cai-card" id="cai-fcard"><div class="cai-row" style="align-items:center"><span class="cai-grow"><b>🤖 ${e(AI.fresh.title || "Make up new rules")}</b><br><span class="cai-hint">${e(AI.fresh.blurb || "Tell Claude what you're in the mood for and it writes new rules for your deck.")}</span></span>
      <button type="button" data-ai="fresh" id="cai-fresh">Make some</button></div></div>`;
  }
  function freshView() {
    const f = ui.fresh, chips = AI.fresh.chips || [];
    return `<div class="cai-box"><label class="cai-lbl" for="cai-fq">What kind of rules?</label>
        <textarea id="cai-fq" rows="2" maxlength="300" placeholder="${e(AI.fresh.placeholder || "e.g. sillier")}">${e(ui.freshQ)}</textarea>
        ${chips.length ? `<div class="cai-chips">${chips.map((t, k) => `<button type="button" class="chip cai-chip" data-ai="fex" data-k="${k}" id="cai-fex-${k}">${e(t)}</button>`).join("")}</div>` : ""}
        ${ui.err ? `<p class="cai-err">${e(ui.err)}</p>` : ""}
        ${ui.busy ? busyLine("Writing new rules") : `<button type="button" class="${f ? "" : "primary"}" data-ai="freshGo" id="cai-freshGo">${f ? "Make different ones" : "Make 4 new rules"}</button>`}</div>
      ${ui.freshMsg ? `<p class="cai-ok" role="status">${e(ui.freshMsg)}</p>` : ""}
      ${f ? `<div class="cai-box" id="cai-fres"><p class="cai-hint">Tick the ones you want.</p>${f.map((r, k) => `<label class="cai-pick"><input type="checkbox" data-fpick="${k}" id="cai-fp-${k}" ${r.on ? "checked" : ""}><span><b>${e(r.title)}</b><span class="cai-hint"> · ${e(AI.fresh.catName ? AI.fresh.catName(r.category) : r.category)}</span><br>${e(r.text)}${r.how ? `<br><span class="cai-hint">${e(r.how)}</span>` : ""}</span></label>`).join("")}
        <button type="button" class="primary" data-ai="freshAdd" id="cai-freshAdd" ${f.some(r => r.on) ? "" : "disabled"}>Add ${f.filter(r => r.on).length === 1 ? "1 rule" : f.filter(r => r.on).length + " rules"} to the deck</button>
        <p class="cai-hint">They're saved as house rules, starred, on this phone.</p></div>` : ""}
      ${keyFoot()}`;
  }
  async function freshGo() {
    if (ui.busy) return;
    const want = ui.freshQ.trim();
    ui.busy = true; ui.err = ""; ui.freshMsg = ""; draw();
    try {
      const r = await call({ system: system(), content: [{ type: "text", text: AI.fresh.task(want, ui.fresh) }], schema: AI.fresh.schema });
      const list = AI.fresh.clean(r).map(x => ({ ...x, on: true }));
      if (!list.length) throw { kind: "bad" };
      ui.fresh = list;
    } catch (err) { ui.err = fail(err); }
    ui.busy = false; draw();
  }

  // ----- events -----
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-ai]"); if (!b) return;
    const a = b.dataset.ai;
    if (a === "ask") { open("ask"); const q = document.getElementById(key ? "cai-q" : "cai-key"); if (q) q.focus(); }
    else if (a === "close") close();
    else if (a === "ex") { const t = (AI.examples || [])[+b.dataset.k]; if (t) { ui.q = t; ui.err = ""; draw(); } }
    else if (a === "askGo") askGo();
    else if (a === "count") pick(b.dataset.k, +b.dataset.i);
    else if (a === "countUse") { const job = ui.job; if (job && job.out) { const spec = AI.count[job.kind]; close(); try { spec.apply(job.i, job.out); } catch (err) { /* the entry closed meanwhile */ } } }
    else if (a === "fresh") { open("fresh"); }
    else if (a === "fex") { const t = (AI.fresh.chips || [])[+b.dataset.k]; if (t) { ui.freshQ = ui.freshQ.trim() ? `${ui.freshQ.trim()}, ${t.replace(/^\W+\s*/, "").toLowerCase()}` : t.replace(/^\W+\s*/, ""); draw(); } }
    else if (a === "freshGo") freshGo();
    else if (a === "freshAdd") {
      const list = (ui.fresh || []).filter(r => r.on); if (!list.length) return;
      try { AI.fresh.add(list); } catch (err) { ui.err = "Couldn't save the rules on this phone."; draw(); return; }
      ui.fresh = null; ui.freshMsg = `Added ${list.length === 1 ? "1 rule" : list.length + " rules"} to the deck as starred house rules.`; draw(); rerender();
    }
    else if (a === "keyChange" || a === "keyOpen") { const from = ui.open ? ui.mode : null; ui.keyDraft = null; ui.keyMsg = null; open("key"); ui.back = from; draw(); }
    else if (a === "keyDone") { ui.mode = ui.back || "ask"; ui.back = null; ui.keyMsg = null; draw(); }
    else if (a === "keySave") {
      const el = document.getElementById("cai-key"), k = cleanKey(ui.keyDraft != null ? ui.keyDraft : el ? el.value : "");
      if (!k) { ui.keyMsg = { k: "err", t: "Paste your key first." }; draw(); return; }
      // a key pasted on the way to a question stays on screen with its check, then goes back to the question
      if (ui.mode !== "key") { ui.back = ui.mode; ui.mode = "key"; }
      saveKey(k); ui.keyDraft = null; testKey("Saved. ");
    }
    else if (a === "keyTest") testKey("");
    else if (a === "keyDrop") {
      if (!ui.confirmDrop) { ui.confirmDrop = true; draw(); setTimeout(() => { ui.confirmDrop = false; if (ui.open) draw(); }, 3500); return; }
      ui.confirmDrop = false; saveKey(""); ui.keyDraft = null; ui.keyMsg = { k: "hint", t: "Key removed from this phone." }; draw(); rerender();
    }
  });
  document.addEventListener("input", ev => {
    const t = ev.target;
    if (t.id === "cai-q") ui.q = t.value;
    else if (t.id === "cai-key") ui.keyDraft = t.value;
    else if (t.id === "cai-fq") ui.freshQ = t.value;
    else if (t.dataset && t.dataset.fpick != null && ui.fresh) { const r = ui.fresh[+t.dataset.fpick]; if (r) { r.on = t.checked; draw(); } }
  });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && ui.open) close(); });

  // How to play gets the Ask card on top; the app's own guide stays the source of the rules
  if (typeof guideView === "function") { baseGuide = guideView; guideView = function () { return askCard() + baseGuide.apply(this, arguments); }; }
  const api = { askCard, countBtns, freshCard, hasKey: () => !!key, toText };
  try { if (AI.mount) AI.mount(api); } catch (err) { /* the app works without the extras */ }
  return api;
})();
/* ai:js:end */
render();
offlineReady();
</script>
</body>
</html>
